[package]
name = "planrisk"
version = "0.1.0"
edition = "2024"
description = "Reads a Terraform plan JSON and flags risky changes: destroys, replacements, widened access, blast radius."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Andrew-Hinson/planrisk"
readme = "README.md"
keywords = ["terraform", "plan", "risk", "ci", "infrastructure"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
predicates = "3.1.4"
