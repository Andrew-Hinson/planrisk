[package]
name = "planrisk"
version = "0.1.0"
edition = "2024"
# The oldest Rust that builds planrisk: globset needs 1.88.
rust-version = "1.88"
description = "Reads a Terraform plan JSON and flags risky changes: destroys, replacements, widened access, blast radius."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Andrew-Hinson/planrisk"
readme = "README.md"
keywords = ["terraform", "plan", "risk", "ci", "infrastructure"]
categories = ["command-line-utilities", "development-tools"]
# Left out of the published crate: CI, release and planning files, and the
# Terraform configs that generate the fixtures. The plan fixtures stay, so
# `cargo test` works from the crate. (`exclude` rather than `include`, since
# `include` ignores .gitignore and would pick up .terraform/ provider binaries.)
exclude = [
    "/.github",
    "/PLAN.md",
    "/dist-workspace.toml",
    "/tests/fixtures/configs",
    "/tests/fixtures/generate.sh",
    "/tests/fixtures/seed_state.py",
]

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
toml = "1.1.8"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
predicates = "3.1.4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
