# TEMPORARY: verifies the release artifacts before the first tag.
#
# Waits for the Release workflow on the same commit (which builds every
# artifact on pull requests while dist's pr-run-mode is "upload"), then on
# each release platform: checks the archive against sha256.sum, serves the
# artifacts locally, installs with the real shell installer, and runs
# tests/release/smoke_test.py on the installed binary.
name: Verify release

on:
  pull_request:

permissions:
  contents: read
  actions: read # to find and download the Release workflow's artifacts

jobs:
  verify:
    name: verify (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: aarch64-apple-darwin, runner: macos-14 }
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v6

      - name: Wait for the Release workflow
        run: |
          for _ in $(seq 1 90); do
            run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow Release --commit "$SHA" \
              --json databaseId,status,conclusion -q '.[0]')
            status=$(echo "$run" | jq -r '.status // empty')
            if [ "$status" = completed ]; then
              conclusion=$(echo "$run" | jq -r .conclusion)
              [ "$conclusion" = success ] || { echo "Release run ended: $conclusion"; exit 1; }
              echo "RUN_ID=$(echo "$run" | jq -r .databaseId)" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 20
          done
          echo "timed out waiting for the Release run"; exit 1

      - name: Download artifacts
        run: |
          mkdir -p dl serve
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -D dl \
            -n "artifacts-build-local-${{ matrix.target }}" -n artifacts-build-global
          find dl -type f \( -name '*.tar.xz' -o -name '*.sha256' -o -name sha256.sum \
            -o -name 'planrisk-installer.sh' \) -exec cp {} serve/ \;
          ls -l serve

      - name: Check the archive against sha256.sum
        working-directory: serve
        run: |
          archive="planrisk-${{ matrix.target }}.tar.xz"
          # sha256.sum lines look like "<hash> *<file>"; rewrite as "<hash>  <file>".
          awk -v a="$archive" '$2 == "*" a || $2 == a { print $1 "  " a }' sha256.sum > expected.sum
          test -s expected.sum
          if command -v sha256sum >/dev/null; then sha256sum -c expected.sum
          else shasum -a 256 -c expected.sum; fi

      - name: Install with the shell installer from a local server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory serve >/dev/null 2>&1 &
          # Wait until the server answers; it can take a few seconds to start.
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8765/sha256.sum && break
            sleep 0.5
          done
          export CARGO_HOME="$RUNNER_TEMP/cargo-home"
          # The installer writes a receipt under the config directory.
          export XDG_CONFIG_HOME="$RUNNER_TEMP/config"
          PLANRISK_DOWNLOAD_URL=http://127.0.0.1:8765 INSTALLER_NO_MODIFY_PATH=1 \
            sh serve/planrisk-installer.sh
          ls -l "$CARGO_HOME/bin/planrisk"
          file "$CARGO_HOME/bin/planrisk"
          echo "PLANRISK=$CARGO_HOME/bin/planrisk" >> "$GITHUB_ENV"

      - name: Smoke test the installed binary
        run: python3 tests/release/smoke_test.py "$PLANRISK"

      - name: Run on other Linux distributions (static binary)
        if: runner.os == 'Linux'
        run: |
          for image in alpine:3 debian:11 fedora:latest; do
            echo "== $image"
            set +e
            docker run --rm -v "$PLANRISK:/planrisk:ro" -v "$PWD/tests/fixtures:/f:ro" "$image" \
              /planrisk /f/mixed-changes.json --format terminal --fail-on critical > out.txt
            code=$?
            set -e
            cat out.txt
            [ "$code" -eq 2 ] || { echo "expected exit 2, got $code"; exit 1; }
            grep -q stateful-replace out.txt
          done
